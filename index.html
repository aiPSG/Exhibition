<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Exhibition — an infinite canvas of works that can be re-arranged into a sortable grid." />
  <title>Exhibition</title>
  <link rel="preconnect" href="https://picsum.photos" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Loading screen (preloads full-resolution images) -->
  <div class="loader" id="loader">
    <div class="loader__inner">
      <div class="loader__brand">EXHIBITION</div>
      <div class="loader__track"><div class="loader__bar" id="loaderBar"></div></div>
      <div class="loader__meta"><span id="loaderPct">0%</span><span>Loading works</span></div>
    </div>
  </div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand__dot" aria-hidden="true"></span>
      <span class="brand__name">Exhibition</span>
      <span class="brand__count" id="workCount">—</span>
    </div>

    <div class="modeswitch" role="tablist" aria-label="View mode">
      <button class="modeswitch__btn is-active" data-mode="canvas" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 9h16M4 15h16M9 4v16M15 4v16" stroke="currentColor" stroke-width="1" opacity=".5"/></svg>
        <span>Canvas</span>
      </button>
      <button class="modeswitch__btn" data-mode="grid" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1" fill="currentColor"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1" fill="currentColor"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1" fill="currentColor"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1" fill="currentColor"/></svg>
        <span>Grid</span>
      </button>
    </div>
  </header>

  <!-- Sort / filter bar (grid mode) -->
  <div class="sortbar" id="sortbar" aria-hidden="true">
    <span class="sortbar__label">Sort</span>
    <div class="sortbar__group" id="sortGroup" role="group" aria-label="Sort criteria">
      <button class="chip is-active" data-sort="name">Name</button>
      <button class="chip" data-sort="color">Color</button>
      <button class="chip" data-sort="category">Category</button>
      <button class="chip" data-sort="mood">Mood</button>
      <button class="chip" data-sort="client">Client</button>
    </div>
    <button class="dir" id="dirBtn" title="Toggle sort direction" aria-label="Toggle sort direction">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- Infinite canvas + grid share one pool of tiles -->
  <main class="canvas" id="canvas" aria-label="Infinite canvas">
    <div class="canvas__scene" id="scene"></div>
    <div class="canvas__vignette" aria-hidden="true"></div>
    <div class="canvas__hint" id="canvasHint">Drag to pan · scroll to travel · pinch to zoom · click a work for details</div>
  </main>

  <!-- Animation settings -->
  <div class="settings" id="settings">
    <button class="settings__toggle" id="settingsToggle" aria-label="Animation settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M19.4 13a7.5 7.5 0 000-2l2-1.5-2-3.5-2.4 1a7.5 7.5 0 00-1.7-1l-.3-2.5h-4l-.3 2.5a7.5 7.5 0 00-1.7 1l-2.4-1-2 3.5L4.6 11a7.5 7.5 0 000 2l-2 1.5 2 3.5 2.4-1a7.5 7.5 0 001.7 1l.3 2.5h4l.3-2.5a7.5 7.5 0 001.7-1l2.4 1 2-3.5-2-1.5z" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6"/></svg>
    </button>
    <div class="settings__panel" id="settingsPanel" hidden>
      <div class="settings__title">Transition</div>
      <div class="settings__row">
        <label for="durRange">Duration</label>
        <input type="range" id="durRange" min="200" max="4000" step="50" value="1400" />
        <div class="settings__num">
          <input type="number" id="durInput" min="100" max="8000" step="50" value="1400" />
          <span>ms</span>
        </div>
      </div>
      <div class="settings__row">
        <label for="easeSelect">Easing</label>
        <select id="easeSelect">
          <option value="linear">Linear</option>
          <option value="easeInQuad">Ease In (quad)</option>
          <option value="easeOutQuad">Ease Out (quad)</option>
          <option value="easeInOutQuad">Ease In-Out (quad)</option>
          <option value="easeInCubic">Ease In (cubic)</option>
          <option value="easeOutCubic">Ease Out (cubic)</option>
          <option value="easeInOutCubic" selected>Ease In-Out (cubic)</option>
          <option value="easeOutBack">Ease Out (back)</option>
          <option value="easeInOutBack">Ease In-Out (back)</option>
        </select>
      </div>
      <div class="settings__note">Grid transition runs in 3 stages: X → Y → Z</div>
    </div>
  </div>

  <!-- Full-screen image overlay (laid out at full size so hi-res stays crisp;
       a transform-scaled tile would rasterise at its tiny layout size) -->
  <div class="focusview" id="focusview" aria-hidden="true">
    <img id="focusImg" alt="" />
  </div>

  <!-- Focus caption — appears when a work is flown to full screen -->
  <div class="focusbar" id="focusbar">
    <span class="focusbar__swatch" id="focusSwatch" aria-hidden="true"></span>
    <div class="focusbar__text">
      <span class="focusbar__title" id="focusTitle"></span>
      <span class="focusbar__facts" id="focusFacts"></span>
    </div>
    <button class="focusbar__close" id="focusClose" aria-label="Exit (Esc)">Close&nbsp;&times;</button>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
